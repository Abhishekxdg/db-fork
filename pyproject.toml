[build-system]
requires = ["setuptools>=61.0", "wheel", "grpcio-tools"]
build-backend = "setuptools.build_meta"

[project]
name = "db-fork"
version = "0.1.0"
description = "Database branching related mess."
authors = [{ name = "Elaine", email = "ra3448@columbia.edu" }]
requires-python = ">=3.11"
dependencies = [
    "faker>=37,<38",  # Generates benchmark rows; a new major can change the data
    "neon-api",
    "numpy",
    "protobuf>=6.32,<7",  # Matches the protoc 32 (6.x) generated *_pb2.py
    "psycopg2-binary",
    "pymysql",
    "aiomysql",  # For async operations on the dolt_mysql backend
    "psycopg[binary]>=3.0",  # For async database operations
    "psycopg-pool",  # Connection pool for async mode (one connection per concurrent request)
    "python-dotenv",
    "requests",  # Neon and Xata HTTP APIs
    "scipy",
    "matplotlib",
    "pyarrow>=22,<23",  # Writes result parquet files
    "tqdm",
    "setuptools",
    "pandas>=2.3,<3",  # pandas 3 has breaking API changes (plot scripts)
]

[project.optional-dependencies]
# Chronos backend (dblib/chronos.py): built from source, needs libpq-dev,
# libboost-dev, libsqlite3-dev, python3-dev and a C++17 compiler (see README).
chronos = [
    "chronos-core @ git+https://github.com/mitdbg/chronos@607418d4d06ba1a67be0e9e5a7617132f265a87c#subdirectory=packages/chronos-core",
    "sqlglot>=25",
]
# TerminusDB backend (dblib/terminusdb.py): maps the microbenchmark's
# statement shapes to document-API and WOQL calls.
terminusdb = [
    "sqlglot>=25",
]

[dependency-groups]
dev = ["pytest"]

[tool.setuptools]
packages = ["dblib", "microbench", "util"]

[tool.setuptools.package-data]
lib = ["*.py"]
dblib = ["*.proto", "*_pb2.py"]

[tool.setuptools.cmdclass]
build_py = "build_protos.BuildWithProtos"

[tool.uv]
# The build step compiles the .proto files into the (untracked) *_pb2.py
# modules. Rebuild the project whenever a .proto file changes, not only when
# pyproject.toml does, so `uv sync` / `uv run` regenerate them.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "build_protos.py" },
    { file = "**/*.proto" },
]
